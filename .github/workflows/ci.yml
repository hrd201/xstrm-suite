name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q cmd src scripts tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh bin/xstrm bin/xstrm-admin
      - name: Reject committed runtime secrets
        run: |
          test ! -e config/runtime.yaml
          test ! -e config/strm-sync.yaml
          ! git grep -nE 'alist-[A-Za-z0-9_-]{30,}|201pc\.win|tmdai\.org'
